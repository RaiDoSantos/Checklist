<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Checklist de Vencimento</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <div class="login-box">
    <h2>Login de Administrador</h2>
    <label for="adminUser">Email</label>
    <input id="adminUser" type="email" placeholder="admin@exemplo.com" autocomplete="username" />
    <label for="adminPassword">Senha</label>
    <input id="adminPassword" type="password" placeholder="Senha" autocomplete="current-password" />
    <button id="loginButton">Entrar</button>
    <p class="login-note">Use um usuário criado no Firebase Authentication.</p>
  </div>
  <script type="module" src="login.js"></script>
</body>
</html>
