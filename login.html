<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Checklist de Vencimento</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <div class="login-box">
    <h2>Login de Administrador</h2>
    <label for="adminUser">Usuário</label>
    <input id="adminUser" type="text" placeholder="admin" value="admin" />
    <label for="adminPassword">Senha</label>
    <input id="adminPassword" type="password" placeholder="Senha" />
    <button id="loginButton">Entrar</button>
    <p class="login-note">Apenas administradores podem acessar o sistema.</p>
  </div>
  <script src="login.js"></script>
</body>
</html>
